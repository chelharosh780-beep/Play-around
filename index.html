<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Around - Ретро Игры</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 40px; 
        }
        h1 { color: #00ff00; text-shadow: 2px 2px #005500; }
        .card { 
            background: #2a2a2a; 
            border: 2px solid #00ff00; 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 600px; 
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <h1>🎮 PLAY AROUND</h1>
    <p>Твой личный портал в мир ретро-игр.</p>
    
    <div class="card">
        <h2>Скоро здесь будет Человек-Паук</h2>
        <p>Я работаю над этим. А пока проверь, как работает кнопка:</p>
        <button onclick="alert('Сайт работает, бро! Ты молодец!')">Проверить сайт</button>
    </div>
</body>
</html>
